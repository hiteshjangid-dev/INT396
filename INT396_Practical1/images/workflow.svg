<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900"><style>.b{fill:#f8fbff;stroke:#3477cf;stroke-width:3}.g{fill:#eef9f4;stroke:#228a67;stroke-width:3}.t{font:700 24px Arial;fill:#17304a}.s{font:16px Arial;fill:#62768b}.a{stroke:#8da0b2;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#8da0b2"/></marker></defs><rect x="150" y="30" width="520" height="95" rx="18" class="b"/><text x="410" y="70" text-anchor="middle" class="t">1. Load the data</text><text x="410" y="100" text-anchor="middle" class="s">200 real customers</text><path d="M410 125V180" class="a"/><rect x="150" y="180" width="520" height="95" rx="18" class="b"/><text x="410" y="220" text-anchor="middle" class="t">2. Pick the features</text><text x="410" y="250" text-anchor="middle" class="s">Age + Income + Spending</text><path d="M410 275V330" class="a"/><rect x="150" y="330" width="520" height="95" rx="18" class="b"/><text x="410" y="370" text-anchor="middle" class="t">3. Make a vector</text><text x="410" y="400" text-anchor="middle" class="s">[Age, Income, Spending]</text><path d="M410 425V480" class="a"/><rect x="90" y="480" width="640" height="105" rx="18" class="g"/><text x="410" y="520" text-anchor="middle" class="t">4. Measure similarity</text><text x="410" y="552" text-anchor="middle" class="s">Euclidean · Manhattan · Cosine</text><path d="M410 585V640" class="a"/><rect x="150" y="640" width="520" height="95" rx="18" class="b"/><text x="410" y="680" text-anchor="middle" class="t">5. Compare customers</text><text x="410" y="710" text-anchor="middle" class="s">find nearest neighbours</text><path d="M410 735V790" class="a"/><rect x="150" y="790" width="520" height="80" rx="18" class="g"/><text x="410" y="825" text-anchor="middle" class="t">6. Observe and conclude</text></svg>