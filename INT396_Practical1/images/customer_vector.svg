<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
<style>
.t{font:700 22px Arial;fill:#17304a}.s{font:16px Arial;fill:#62768b}
.a{fill:#eaf3ff;stroke:#3477cf;stroke-width:3}.b{fill:#eef9f4;stroke:#228a67;stroke-width:3}
.l{stroke:#8da0b2;stroke-width:3;marker-end:url(#m)}
</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3z" fill="#8da0b2"/></marker></defs>
<rect x="40" y="55" width="300" height="125" rx="18" class="a"/>
<text x="190" y="98" text-anchor="middle" class="t">Customer 1</text>
<text x="190" y="133" text-anchor="middle" class="s">Age 19 · Income 15 · Spend 39</text>
<text x="190" y="160" text-anchor="middle" class="s">A = [19, 15, 39]</text>
<path d="M340 118 H490" class="l"/>
<rect x="520" y="55" width="300" height="125" rx="18" class="b"/>
<text x="670" y="98" text-anchor="middle" class="t">Customer 2</text>
<text x="670" y="133" text-anchor="middle" class="s">Age 21 · Income 15 · Spend 81</text>
<text x="670" y="160" text-anchor="middle" class="s">B = [21, 15, 81]</text>
<text x="430" y="245" text-anchor="middle" class="t">The computer compares the numbers</text>
<text x="430" y="280" text-anchor="middle" class="s">not the customer names, pictures, or IDs</text>
</svg>