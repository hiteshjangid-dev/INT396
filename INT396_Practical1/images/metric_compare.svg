<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430">
<style>.b{fill:#f8fbff;stroke:#3477cf;stroke-width:3}.g{fill:#eef9f4;stroke:#228a67;stroke-width:3}.a{fill:#fff5df;stroke:#d2a054;stroke-width:3}.t{font:700 22px Arial;fill:#17304a}.s{font:15px Arial;fill:#62768b}</style>
<rect x="35" y="45" width="240" height="260" rx="18" class="b"/>
<text x="155" y="90" text-anchor="middle" class="t">Euclidean</text>
<text x="155" y="130" text-anchor="middle" class="s">Straight line</text>
<text x="155" y="175" text-anchor="middle" class="s">Question:</text>
<text x="155" y="205" text-anchor="middle" class="s">How far apart?</text>
<text x="155" y="252" text-anchor="middle" class="s">lower = closer</text>

<rect x="310" y="45" width="240" height="260" rx="18" class="a"/>
<text x="430" y="90" text-anchor="middle" class="t">Manhattan</text>
<text x="430" y="130" text-anchor="middle" class="s">Axis-by-axis</text>
<text x="430" y="175" text-anchor="middle" class="s">Question:</text>
<text x="430" y="205" text-anchor="middle" class="s">How much movement?</text>
<text x="430" y="252" text-anchor="middle" class="s">lower = closer</text>

<rect x="585" y="45" width="240" height="260" rx="18" class="g"/>
<text x="705" y="90" text-anchor="middle" class="t">Cosine</text>
<text x="705" y="130" text-anchor="middle" class="s">Direction</text>
<text x="705" y="175" text-anchor="middle" class="s">Question:</text>
<text x="705" y="205" text-anchor="middle" class="s">How aligned?</text>
<text x="705" y="252" text-anchor="middle" class="s">higher = more similar</text>

<text x="430" y="365" text-anchor="middle" class="s">Same data · different definition of “similar”</text>
</svg>